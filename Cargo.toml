[workspace]
members = [
    "apps/desktop",
    "apps/runner",
    "crates/domain",
    "crates/harness-core",
    "crates/harness-codex",
    "crates/harness-claude",
    "crates/protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
gpui-kit = "0.6.0"
nix = { version = "0.30", features = ["signal"] }
rfd = "0.17.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

# GPUI builds the element tree and computes layout on every scrolling frame.
# Keep development builds responsive while retaining debug information/checks.
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
