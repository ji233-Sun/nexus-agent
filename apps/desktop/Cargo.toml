[package]
name = "nexus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64 = "0.22"
chrono.workspace = true
cpal = "0.16"
futures-util.workspace = true
gpui-kit.workspace = true
gpui-pre-reqwest-client = "0.3.3"
keyring.workspace = true
nexus-domain = { path = "../../crates/domain" }
nexus-harness-core = { path = "../../crates/harness-core" }
nexus-protocol = { path = "../../crates/protocol" }
nexus-runner = { path = "../runner" }
rfd.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite.workspace = true
semver = "1.0.28"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
smol.workspace = true
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }
tower-http = { workspace = true, features = ["fs"] }
uuid.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.55.1", default-features = false, features = ["os-webview"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tokio-tungstenite.workspace = true
tower.workspace = true
