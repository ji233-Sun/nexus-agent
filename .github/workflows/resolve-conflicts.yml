name: Resolve PR conflicts

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: resolve-conflicts-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.body == '/resolve-conflicts'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.prepare.outputs.authorized }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      outcome: ${{ steps.resolve.outputs.outcome || steps.prepare.outputs.outcome }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Authorize command and capture PR commits
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "automation/.github/scripts/resolve-conflicts.mjs" prepare

      - uses: actions/checkout@v6
        if: steps.prepare.outputs.eligible == 'true'
        with:
          ref: ${{ steps.prepare.outputs.head_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Resolve text conflicts with DeepSeek
        if: steps.prepare.outputs.eligible == 'true'
        id: resolve
        env:
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          node "automation/.github/scripts/resolve-conflicts.mjs" resolve
          "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/conflict-resolution/candidate.bundle"

      - uses: actions/upload-artifact@v7
        if: steps.resolve.outputs.outcome == 'resolved'
        id: bundle
        with:
          name: conflict-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conflict-resolution/candidate.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.outputs.authorized == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/download-artifact@v8
        if: needs.resolve.result == 'success' && needs.resolve.outputs.outcome == 'resolved'
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          path: ${{ runner.temp }}/conflict-resolution

      - name: Publish result and start CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          OUTCOME: ${{ needs.resolve.outputs.outcome }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        run: >-
          node ".github/scripts/resolve-conflicts.mjs" publish
          "$GITHUB_WORKSPACE" "$RUNNER_TEMP/conflict-resolution/candidate.bundle"
